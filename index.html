<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Dodge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #070913;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      display: block;
      background: radial-gradient(circle at center, #0f172a 0%, #05070f 100%);
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.12);
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 14px;
    }
    .badge {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 8px 14px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    .badge span {
      color: #38bdf8;
      font-size: 16px;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 7, 15, 0.82);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(6px);
      transition: opacity 0.25s ease;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    h1 {
      font-size: clamp(36px, 7vw, 64px);
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #38bdf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    p {
      max-width: 420px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
      font-size: 15px;
    }
    #final-stats {
      margin-bottom: 24px;
      font-size: 18px;
      color: #f8fafc;
      display: none;
    }
    button {
      background: linear-gradient(135deg, #0284c7, #ec4899);
      color: #fff;
      border: none;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.65);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div id="ui">
    <div class="badge">Score: <span id="score-el">0</span></div>
    <div class="badge">Wave: <span id="wave-el">1</span></div>
    <div class="badge">Best: <span id="best-el">0</span></div>
  </div>

  <div id="overlay">
    <h1 id="title-el">NEON DODGE</h1>
    <p id="desc-el">Move with <strong>WASD / Arrow Keys</strong> or drag with your <strong>Mouse / Finger</strong>. Survive waves as hazards speed up and multiply. Graze enemies for bonus points!</p>
    <div id="final-stats"></div>
    <button id="start-btn">PLAY</button>
  </div>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score-el');
    const waveEl = document.getElementById('wave-el');
    const bestEl = document.getElementById('best-el');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title-el');
    const descEl = document.getElementById('desc-el');
    const finalStats = document.getElementById('final-stats');
    const startBtn = document.getElementById('start-btn');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Audio Synthesizer (zero external assets needed)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playTone(freq, type, duration, vol = 0.08) {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Game State
    let running = false;
    let score = 0;
    let bestScore = Number(localStorage.getItem('neon_dodge_best') || 0);
    bestEl.textContent = bestScore;

    let wave = 1;
    let waveTimer = 0;
    const WAVE_DURATION = 10; // Seconds per wave
    let spawnTimer = 0;
    let shake = 0;
    let lastTime = 0;

    const player = {
      x: width / 2,
      y: height / 2,
      r: 13,
      speed: 420,
      trail: []
    };

    let hazards = [];
    let particles = [];
    let floatingTexts = [];

    // Input Handling
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let pointerActive = false;
    let pointerPos = { x: width / 2, y: height / 2 };

    canvas.addEventListener('pointerdown', e => {
      pointerActive = true;
      pointerPos.x = e.clientX;
      pointerPos.y = e.clientY;
    });
    window.addEventListener('pointermove', e => {
      if (pointerActive) {
        pointerPos.x = e.clientX;
        pointerPos.y = e.clientY;
      }
    });
    window.addEventListener('pointerup', () => pointerActive = false);

    function spawnParticles(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 60 + Math.random() * 220;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1,
          decay: 1.5 + Math.random() * 1.5,
          color,
          size: 2 + Math.random() * 3
        });
      }
    }

    function addFloatingText(x, y, text, color) {
      floatingTexts.push({ x, y, text, color, life: 1 });
    }

    function spawnHazard() {
      // Spawn from random screen edge
      const side = Math.floor(Math.random() * 4);
      let x, y;
      const pad = 30;
      if (side === 0) { x = Math.random() * width; y = -pad; }
      else if (side === 1) { x = width + pad; y = Math.random() * height; }
      else if (side === 2) { x = Math.random() * width; y = height + pad; }
      else { x = -pad; y = Math.random() * height; }

      // Difficulty scales with wave
      const speedMult = 1 + (wave - 1) * 0.14;
      const roll = Math.random();

      let type = 'normal';
      let color = '#f43f5e';
      let r = 11 + Math.random() * 6;
      let speed = (170 + Math.random() * 90) * speedMult;

      if (wave >= 2 && roll < 0.28) {
        type = 'dasher';
        color = '#facc15';
        r = 8;
        speed = (310 + Math.random() * 80) * speedMult;
      } else if (wave >= 3 && roll < 0.5) {
        type = 'seeker';
        color = '#c084fc';
        r = 12;
        speed = (150 + Math.random() * 50) * speedMult;
      } else if (wave >= 4 && roll < 0.65) {
        type = 'giant';
        color = '#fb923c';
        r = 24;
        speed = (115 + Math.random() * 40) * speedMult;
      }

      const angle = Math.atan2(player.y - y, player.x - x) + (Math.random() - 0.5) * 0.35;
      hazards.push({
        x, y, r, type, color, speed,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        grazed: false,
        age: 0
      });
    }

    function startGame() {
      score = 0;
      wave = 1;
      waveTimer = 0;
      spawnTimer = 0;
      hazards = [];
      particles = [];
      floatingTexts = [];
      player.x = width / 2;
      player.y = height / 2;
      player.trail = [];
      pointerActive = false;

      scoreEl.textContent = '0';
      waveEl.textContent = '1';
      overlay.classList.add('hidden');
      running = true;
      lastTime = performance.now();
      playTone(440, 'triangle', 0.15);
      requestAnimationFrame(loop);
    }

    function gameOver() {
      running = false;
      shake = 18;
      spawnParticles(player.x, player.y, '#38bdf8', 35);
      playTone(130, 'sawtooth', 0.45, 0.15);

      const finalInt = Math.floor(score);
      if (finalInt > bestScore) {
        bestScore = finalInt;
        localStorage.setItem('neon_dodge_best', bestScore);
        bestEl.textContent = bestScore;
      }

      titleEl.textContent = 'GAME OVER';
      descEl.style.display = 'none';
      finalStats.style.display = 'block';
      finalStats.innerHTML = `Final Score: <strong>${finalInt}</strong> &nbsp;|&nbsp; Reached Wave <strong>${wave}</strong>`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    function update(dt) {
      // Score & Wave progression
      score += dt * (10 + wave * 2);
      waveTimer += dt;
      if (waveTimer >= WAVE_DURATION) {
        waveTimer = 0;
        wave++;
        waveEl.textContent = wave;
        playTone(587.33, 'sine', 0.25);
        addFloatingText(width / 2, height * 0.25, `WAVE ${wave}!`, '#38bdf8');
      }
      scoreEl.textContent = Math.floor(score);

      // Player movement
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        player.x += (dx / len) * player.speed * dt;
        player.y += (dy / len) * player.speed * dt;
      } else if (pointerActive) {
        const pdx = pointerPos.x - player.x;
        const pdy = pointerPos.y - player.y;
        const dist = Math.hypot(pdx, pdy);
        if (dist > 4) {
          const move = Math.min(dist, player.speed * 1.35 * dt);
          player.x += (pdx / dist) * move;
          player.y += (pdy / dist) * move;
        }
      }

      // Keep player inside screen
      player.x = Math.max(player.r, Math.min(width - player.r, player.x));
      player.y = Math.max(player.r, Math.min(height - player.r, player.y));

      player.trail.push({ x: player.x, y: player.y });
      if (player.trail.length > 12) player.trail.shift();

      // Spawn hazards faster each wave
      const spawnInterval = Math.max(0.16, 0.72 - (wave - 1) * 0.065);
      spawnTimer += dt;
      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnHazard();
      }

      // Update hazards
      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.age += dt;

        // Seeker gently homes toward player during its first 2.5 seconds
        if (h.type === 'seeker' && h.age < 2.5) {
          const targetAngle = Math.atan2(player.y - h.y, player.x - h.x);
          const currentAngle = Math.atan2(h.vy, h.vx);
          let diff = targetAngle - currentAngle;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          const newAngle = currentAngle + diff * 2.2 * dt;
          h.vx = Math.cos(newAngle) * h.speed;
          h.vy = Math.sin(newAngle) * h.speed;
        }

        h.x += h.vx * dt;
        h.y += h.vy * dt;

        const dist = Math.hypot(player.x - h.x, player.y - h.y);

        // Collision check
        if (dist < player.r + h.r - 2) {
          gameOver();
          return;
        }

        // Near-miss graze bonus
        if (!h.grazed && dist < player.r + h.r + 22) {
          h.grazed = true;
          score += 25;
          playTone(880, 'sine', 0.08, 0.04);
          addFloatingText(player.x, player.y - 20, '+25 GRAZE', '#4ade80');
        }

        // Despawn far off-screen
        if (h.x < -100 || h.x > width + 100 || h.y < -100 || h.y > height + 100) {
          hazards.splice(i, 1);
        }
      }

      // Update particles & floating texts
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 35 * dt;
        ft.life -= 1.1 * dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      if (shake > 0) shake = Math.max(0, shake - 40 * dt);
    }

    function draw() {
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }

      ctx.clearRect(0, 0, width, height);

      // Subtle background grid
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
      ctx.lineWidth = 1;
      const gridSize = 50;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }

      // Player trail
      player.trail.forEach((pt, idx) => {
        const alpha = (idx / player.trail.length) * 0.35;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, player.r * (idx / player.trail.length), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${alpha})`;
        ctx.fill();
      });

      // Player
      if (running) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Hazards
      hazards.forEach(h => {
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
        ctx.fillStyle = h.color;
        ctx.shadowColor = h.color;
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
      ctx.globalAlpha = 1;

      // Floating texts
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.textAlign = 'center';
      floatingTexts.forEach(ft => {
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
      });
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    function loop(now) {
      if (!running) {
        draw();
        return;
      }
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', startGame);
    draw();
  </script>
</body>
</html>
